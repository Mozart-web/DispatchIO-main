services:
  - type: web
    name: transio-api
    runtime: node
    rootDir: TransIO-main/services/api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://uugvqaqadombnojiqvhg.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 10000